<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchwepeSwap 🌊⚡ | MasterChef Yield Farm Control Center</title>
  <link rel="icon" type="image/svg+xml" href="https://explorer.somnia.network/assets/favicon/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Code+Pro:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel standalone for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #070913;
      --bg-card: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(168, 85, 247, 0.4);
      --primary-purple: #9333ea;
      --primary-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 20%, rgba(147, 51, 234, 0.22) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(6, 182, 212, 0.22) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .glass-panel:hover {
      border-color: var(--border-glow);
      box-shadow: 0 24px 48px rgba(147, 51, 234, 0.25);
    }

    .btn-gradient {
      background: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-cyan) 100%);
      color: #ffffff;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(147, 51, 234, 0.5);
    }

    .btn-deploy {
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
      color: #ffffff;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(236, 72, 153, 0.4);
      transition: all 0.2s ease;
    }

    .btn-deploy:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.6);
    }

    .badge-somnia {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 20px;
      padding: 26px;
      width: 92%;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px;
      transition: all 0.2s ease;
    }

    .stat-card:hover {
      border-color: rgba(168, 85, 247, 0.4);
    }

    .wallet-option {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .wallet-option:hover {
      background: rgba(147, 51, 234, 0.25);
      border-color: rgba(147, 51, 234, 0.6);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SOMI_MAINNET_PARAMS = {
      chainId: '0x13a7', // 5031 in hex
      chainName: 'Somnia Mainnet',
      nativeCurrency: { name: 'Somnia Token', symbol: 'SOMI', decimals: 18 },
      rpcUrls: ['https://api.infra.mainnet.somnia.network/'],
      blockExplorerUrls: ['https://explorer.somnia.network']
    };

    const SOMI_TARGET = '0xdd10620866c4f586b1213d3818811faf3718fce3';
    const SOMNEX_LP_TARGET = '0x8008595d869746E6D594d9EB52E8175714fff278';
    const WSOMI_TARGET = '0x046ede9564a72571df6f5e44d0405360c0f4dcab';

    function App() {
      // Default primary active view is 'farms' (MasterChef Control Center)
      const [activeTab, setActiveTab] = useState('farms');
      const [network, setNetwork] = useState('mainnet');
      const [wallet, setWallet] = useState('');
      const [balance, setBalance] = useState('0.00');
      const [showWalletModal, setShowWalletModal] = useState(false);
      const [showDeployModal, setShowDeployModal] = useState(false);
      const [deployTab, setDeployTab] = useState('contract'); // 'contract' or 'pool'
      
      // Deploy Form Inputs
      const [deployStartBlock, setDeployStartBlock] = useState('377050936');
      const [newLpAddress, setNewLpAddress] = useState(SOMNEX_LP_TARGET);
      const [newAllocPoints, setNewAllocPoints] = useState('400');
      const [deployingStatus, setDeployingStatus] = useState('');

      // Farm Pool State
      const [pools, setPools] = useState([
        { id: 0, name: 'SOMI / WSOMI LP', pairAddress: SOMNEX_LP_TARGET, apr: '188.5%', tvl: '$4,580,000', allocPts: 400, weight: '40%', earned: '24.50 SCHWEPE', userStaked: '124.50 SALP' },
        { id: 1, name: 'SOMI / SCHWEPE LP', pairAddress: '0x1111111111111111111111111111111111111111', apr: '142.8%', tvl: '$1,248,500', allocPts: 350, weight: '35%', earned: '18.22 SCHWEPE', userStaked: '50.00 SCHWEPE-LP' },
        { id: 2, name: 'SOMI / USDT LP', pairAddress: '0x2222222222222222222222222222222222222222', apr: '88.4%', tvl: '$3,890,200', allocPts: 150, weight: '15%', earned: '4.10 SCHWEPE', userStaked: '0.00 LP' },
        { id: 3, name: 'SCHWEPE / USDC LP', pairAddress: '0x3333333333333333333333333333333333333333', apr: '112.5%', tvl: '$890,100', allocPts: 100, weight: '10%', earned: '2.10 SCHWEPE', userStaked: '0.00 LP' }
      ]);

      const [amountIn, setAmountIn] = useState('100');
      const amountOut = (parseFloat(amountIn || '0') * 2.4852).toFixed(4);

      useEffect(() => {
        if (window.ethereum) {
          window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
            if (accounts.length > 0) {
              setWallet(accounts[0]);
              fetchBalance(accounts[0]);
            }
          }).catch(console.error);

          window.ethereum.on('accountsChanged', (accounts) => {
            if (accounts.length > 0) {
              setWallet(accounts[0]);
              fetchBalance(accounts[0]);
            } else {
              setWallet('');
              setBalance('0.00');
            }
          });
        }
      }, []);

      const fetchBalance = async (address) => {
        try {
          if (window.ethereum) {
            const rawBal = await window.ethereum.request({ method: 'eth_getBalance', params: [address, 'latest'] });
            const balInEther = (parseInt(rawBal, 16) / 1e18).toFixed(4);
            setBalance(balInEther);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleConnectWallet = async () => {
        if (window.ethereum) {
          try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            if (accounts.length > 0) {
              setWallet(accounts[0]);
              await fetchBalance(accounts[0]);
              setShowWalletModal(false);
            }
          } catch (err) {
            console.error(err);
          }
        } else {
          setWallet(SOMI_TARGET);
          setBalance('1,500.0000');
          setShowWalletModal(false);
        }
      };

      const handleDeployContract = async () => {
        setDeployingStatus('Broadcasting SchwepeMasterChef.sol bytecode to Somnia EVM...');
        await new Promise(r => setTimeout(r, 1200));
        const txHash = '0x' + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
        setDeployingStatus(`✅ SchwepeMasterChef Deployed on Somnia Block #${deployStartBlock}! Tx: ${txHash.substring(0,10)}...`);
        setTimeout(() => {
          setDeployingStatus('');
          setShowDeployModal(false);
        }, 2000);
      };

      const handleAddPool = async () => {
        setDeployingStatus('Executing MasterChef.add(allocPoint, lpToken)...');
        await new Promise(r => setTimeout(r, 1000));
        const newId = pools.length;
        setPools(prev => [
          ...prev,
          {
            id: newId,
            name: `CUSTOM LP (${newLpAddress.substring(0,6)}...)`,
            pairAddress: newLpAddress,
            apr: '165.0%',
            tvl: '$500,000',
            allocPts: parseInt(newAllocPoints),
            weight: '12%',
            earned: '0.00 SCHWEPE',
            userStaked: '0.00 LP'
          }
        ]);
        setDeployingStatus('✅ New Farm Pool Added Successfully!');
        setTimeout(() => {
          setDeployingStatus('');
          setShowDeployModal(false);
        }, 1500);
      };

      const handleClaimRewards = (poolId) => {
        setPools(prev => prev.map(p => p.id === poolId ? { ...p, earned: '0.00 SCHWEPE' } : p));
        alert('🎉 $SCHWEPE rewards harvested successfully to wallet!');
      };

      return (
        <div style={{ padding: '20px', maxWidth: '1180px', margin: '0 auto' }}>
          
          {/* Header / Navbar (WITHOUT Web3 Pipeline tab) */}
          <header className="glass-panel" style={{ padding: '16px 24px', marginBottom: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <div style={{ background: 'linear-gradient(135deg, #ec4899, #9333ea)', padding: '10px', borderRadius: '14px', fontSize: '1.4rem' }}>🌾</div>
              <div>
                <h1 style={{ fontSize: '1.3rem', fontWeight: 800, background: 'linear-gradient(90deg, #fff, #ec4899, #38bdf8)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                  SchwepeSwap <span style={{ fontSize: '0.85rem', color: '#ec4899', fontWeight: 600 }}>MasterChef Hub</span>
                </h1>
                <span className="badge-somnia"><span className="pulse-dot"></span> Somnia EVM ({network === 'mainnet' ? '5031' : '50312'})</span>
              </div>
            </div>

            {/* Navigation Bar (Clean: Farms, Swap, Liquidity - NO Pipeline) */}
            <nav style={{ display: 'flex', gap: '8px', background: 'rgba(15,23,42,0.6)', padding: '4px', borderRadius: '12px' }}>
              {[
                { id: 'farms', label: '🌾 Farms Control Center' },
                { id: 'swap', label: '⇄ Swap' },
                { id: 'liquidity', label: '💧 Liquidity' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  style={{
                    background: activeTab === tab.id ? 'linear-gradient(135deg, #ec4899, #9333ea)' : 'transparent',
                    color: activeTab === tab.id ? '#fff' : '#94a3b8',
                    border: 'none', padding: '8px 18px', borderRadius: '10px', fontWeight: 700, cursor: 'pointer'
                  }}
                >
                  {tab.label}
                </button>
              ))}
            </nav>

            {/* Action Buttons */}
            <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
              {/* Deploy Button in Header */}
              <button onClick={() => setShowDeployModal(true)} className="btn-deploy">
                🚀 Deploy
              </button>

              <a href="https://explorer.somnia.network/address/0xdd10620866c4f586b1213d3818811faf3718fce3" target="_blank" style={{ color: '#38bdf8', fontSize: '0.85rem', textDecoration: 'none' }}>SOMI Contract ↗</a>

              <button onClick={() => wallet ? setShowWalletModal(true) : handleConnectWallet()} className="btn-gradient" style={{ fontSize: '0.85rem' }}>
                {wallet ? `${wallet.substring(0,6)}...${wallet.substring(38)}` : 'Connect Wallet'}
              </button>
            </div>
          </header>

          {/* MAIN VIEW: MasterChef Yield Farm Control Center */}
          <main>
            {activeTab === 'farms' && (
              <div>
                
                {/* Global Metrics Dashboard */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '16px', marginBottom: '24px' }}>
                  <div className="stat-card">
                    <div style={{ fontSize: '0.8rem', color: '#94a3b8', textTransform: 'uppercase' }}>Total Value Locked</div>
                    <div style={{ fontSize: '1.6rem', fontWeight: 800, color: '#fff', marginTop: '4px' }}>$18,450,920</div>
                    <div style={{ fontSize: '0.75rem', color: '#22c55e', marginTop: '2px' }}>↑ 14.2% 24h</div>
                  </div>

                  <div className="stat-card">
                    <div style={{ fontSize: '0.8rem', color: '#94a3b8', textTransform: 'uppercase' }}>$SCHWEPE Emission Rate</div>
                    <div style={{ fontSize: '1.6rem', fontWeight: 800, color: '#ec4899', marginTop: '4px' }}>10.0 / block</div>
                    <div style={{ fontSize: '0.75rem', color: '#94a3b8', marginTop: '2px' }}>MasterChef Block Allocation</div>
                  </div>

                  <div className="stat-card">
                    <div style={{ fontSize: '0.8rem', color: '#94a3b8', textTransform: 'uppercase' }}>Total Allocation Points</div>
                    <div style={{ fontSize: '1.6rem', fontWeight: 800, color: '#a855f7', marginTop: '4px' }}>1,000 Points</div>
                    <div style={{ fontSize: '0.75rem', color: '#94a3b8', marginTop: '2px' }}>Across {pools.length} Active Pools</div>
                  </div>

                  <div className="stat-card">
                    <div style={{ fontSize: '0.8rem', color: '#94a3b8', textTransform: 'uppercase' }}>Harvestable Rewards</div>
                    <div style={{ fontSize: '1.6rem', fontWeight: 800, color: '#38bdf8', marginTop: '4px' }}>48.92 SCHWEPE</div>
                    <button onClick={() => alert('Harvested 48.92 SCHWEPE to wallet!')} className="btn-gradient" style={{ padding: '4px 10px', fontSize: '0.75rem', marginTop: '6px' }}>Claim All</button>
                  </div>
                </div>

                {/* Dashboard Control Bar */}
                <div className="glass-panel" style={{ padding: '18px 24px', marginBottom: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '14px' }}>
                  <div>
                    <h2 style={{ fontSize: '1.2rem', fontWeight: 800, display: 'flex', alignItems: 'center', gap: '8px' }}>
                      🌾 MasterChef Reward Pools
                    </h2>
                    <p style={{ color: '#94a3b8', fontSize: '0.85rem' }}>Executive Yield Farm Management on Somnia EVM</p>
                  </div>

                  <div style={{ display: 'flex', gap: '12px' }}>
                    <button onClick={() => { setDeployTab('contract'); setShowDeployModal(true); }} className="btn-deploy">
                      🚀 Deploy MasterChef Contract
                    </button>
                    <button onClick={() => { setDeployTab('pool'); setShowDeployModal(true); }} className="btn-gradient">
                      ➕ Add New Farm Pool
                    </button>
                  </div>
                </div>

                {/* Farm Pools Grid */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '20px' }}>
                  {pools.map(pool => (
                    <div key={pool.id} className="glass-panel" style={{ padding: '22px' }}>
                      
                      {/* Pool Header */}
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
                        <div>
                          <h3 style={{ fontSize: '1.1rem', fontWeight: 800, color: '#fff' }}>{pool.name}</h3>
                          <a href={`https://explorer.somnia.network/address/${pool.pairAddress}`} target="_blank" style={{ color: '#38bdf8', fontSize: '0.75rem', textDecoration: 'none' }}>
                            {pool.pairAddress.substring(0,8)}...{pool.pairAddress.substring(36)} ↗
                          </a>
                        </div>
                        <span className="badge-somnia" style={{ color: '#ec4899', borderColor: 'rgba(236,72,153,0.4)', background: 'rgba(236,72,153,0.15)', fontSize: '0.85rem' }}>
                          ✨ {pool.apr} APR
                        </span>
                      </div>

                      {/* Pool Stats */}
                      <div style={{ background: 'rgba(15,23,42,0.8)', padding: '14px', borderRadius: '14px', marginBottom: '16px', fontSize: '0.85rem' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px', color: '#94a3b8' }}>
                          <span>Pool TVL</span><strong style={{ color: '#fff' }}>{pool.tvl}</strong>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px', color: '#94a3b8' }}>
                          <span>Allocation Weight</span><strong style={{ color: '#a855f7' }}>{pool.allocPts} pts ({pool.weight})</strong>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', color: '#94a3b8' }}>
                          <span>Earned $SCHWEPE</span><strong style={{ color: '#38bdf8' }}>{pool.earned}</strong>
                        </div>
                      </div>

                      {/* Action Buttons */}
                      <div style={{ display: 'flex', gap: '8px' }}>
                        <button onClick={() => handleClaimRewards(pool.id)} className="btn-gradient" style={{ flex: 1, padding: '10px', fontSize: '0.85rem' }}>
                          Harvest
                        </button>
                        <button onClick={() => alert(`Staked LP Tokens in ${pool.name}`)} className="btn-deploy" style={{ flex: 1, padding: '10px', fontSize: '0.85rem', justifyContent: 'center' }}>
                          Stake LP
                        </button>
                      </div>

                    </div>
                  ))}
                </div>

              </div>
            )}

            {/* SWAP VIEW */}
            {activeTab === 'swap' && (
              <div className="glass-panel" style={{ maxWidth: '460px', margin: '0 auto', padding: '24px' }}>
                <h2 style={{ fontSize: '1.2rem', marginBottom: '16px' }}>Swap Tokens</h2>
                
                <div style={{ background: 'rgba(15,23,42,0.8)', padding: '14px', borderRadius: '14px', marginBottom: '12px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: '#94a3b8', fontSize: '0.8rem', marginBottom: '4px' }}>
                    <span>You Pay</span><span>Balance: {balance} SOMI</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <input type="number" value={amountIn} onChange={e => setAmountIn(e.target.value)} style={{ background: 'none', border: 'none', color: '#fff', fontSize: '1.8rem', width: '60%', outline: 'none', fontWeight: 700 }} />
                    <span style={{ background: 'rgba(255,255,255,0.1)', padding: '6px 12px', borderRadius: '10px', fontWeight: 700 }}>SOMI</span>
                  </div>
                </div>

                <div style={{ textAlign: 'center', margin: '8px 0', color: '#a855f7' }}>⬇</div>

                <div style={{ background: 'rgba(15,23,42,0.8)', padding: '14px', borderRadius: '14px', marginBottom: '20px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: '#94a3b8', fontSize: '0.8rem', marginBottom: '4px' }}>
                    <span>You Receive (Estimated)</span><span>Balance: 0.00 SCHWEPE</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <input type="text" readOnly value={amountOut} style={{ background: 'none', border: 'none', color: '#38bdf8', fontSize: '1.8rem', width: '60%', outline: 'none', fontWeight: 700 }} />
                    <span style={{ background: 'rgba(255,255,255,0.1)', padding: '6px 12px', borderRadius: '10px', fontWeight: 700 }}>SCHWEPE</span>
                  </div>
                </div>

                <button onClick={() => wallet ? alert('Executing swap on Somnia EVM...') : setShowWalletModal(true)} className="btn-gradient" style={{ width: '100%', fontSize: '1.1rem', padding: '14px' }}>
                  {wallet ? 'Swap' : 'Connect Wallet'}
                </button>
              </div>
            )}

            {/* LIQUIDITY VIEW */}
            {activeTab === 'liquidity' && (
              <div className="glass-panel" style={{ maxWidth: '500px', margin: '0 auto', padding: '24px' }}>
                <h2>💧 Add Liquidity Pool</h2>
                <p style={{ color: '#94a3b8', fontSize: '0.85rem', marginBottom: '20px' }}>Earn 0.25% trading fees on Somnia Network</p>
                <button className="btn-gradient" style={{ width: '100%' }}>Supply SOMI / SCHWEPE Liquidity</button>
              </div>
            )}
          </main>

          {/* DEPLOYMENT MODAL */}
          {showDeployModal && (
            <div className="modal-overlay" onClick={() => setShowDeployModal(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px' }}>
                  <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>🚀 Deploy &amp; Manage MasterChef</h3>
                  <button onClick={() => setShowDeployModal(false)} style={{ background: 'none', border: 'none', color: '#94a3b8', fontSize: '1.4rem', cursor: 'pointer' }}>✕</button>
                </div>

                {/* Subtabs */}
                <div style={{ display: 'flex', gap: '8px', background: 'rgba(255,255,255,0.05)', padding: '4px', borderRadius: '10px', marginBottom: '20px' }}>
                  <button
                    onClick={() => setDeployTab('contract')}
                    style={{
                      flex: 1, padding: '8px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontWeight: 700,
                      background: deployTab === 'contract' ? 'linear-gradient(135deg, #ec4899, #a855f7)' : 'transparent',
                      color: deployTab === 'contract' ? '#fff' : '#94a3b8'
                    }}
                  >
                    Deploy Contract
                  </button>
                  <button
                    onClick={() => setDeployTab('pool')}
                    style={{
                      flex: 1, padding: '8px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontWeight: 700,
                      background: deployTab === 'pool' ? 'linear-gradient(135deg, #ec4899, #a855f7)' : 'transparent',
                      color: deployTab === 'pool' ? '#fff' : '#94a3b8'
                    }}
                  >
                    Add Farm Pool
                  </button>
                </div>

                {deployTab === 'contract' ? (
                  <div>
                    <div style={{ background: 'rgba(255,255,255,0.03)', padding: '14px', borderRadius: '12px', marginBottom: '16px', fontSize: '0.85rem' }}>
                      <div style={{ color: '#94a3b8', marginBottom: '4px' }}>Target Network</div>
                      <div style={{ color: '#38bdf8', fontWeight: 700 }}>Somnia Mainnet (Chain ID 5031)</div>
                      <div style={{ color: '#94a3b8', marginTop: '8px', marginBottom: '4px' }}>Start Block Height</div>
                      <input
                        type="text"
                        value={deployStartBlock}
                        onChange={e => setDeployStartBlock(e.target.value)}
                        style={{ width: '100%', background: '#070913', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', padding: '8px', borderRadius: '8px', outline: 'none' }}
                      />
                    </div>

                    {deployingStatus && (
                      <div style={{ color: '#a855f7', fontWeight: 700, fontSize: '0.85rem', marginBottom: '14px', textAlign: 'center' }}>
                        {deployingStatus}
                      </div>
                    )}

                    <button onClick={handleDeployContract} className="btn-deploy" style={{ width: '100%', justifyContent: 'center', padding: '12px' }}>
                      🚀 Deploy SchwepeMasterChef Bytecode
                    </button>
                  </div>
                ) : (
                  <div>
                    <div style={{ background: 'rgba(255,255,255,0.03)', padding: '14px', borderRadius: '12px', marginBottom: '16px', fontSize: '0.85rem' }}>
                      <div style={{ color: '#94a3b8', marginBottom: '4px' }}>LP Token Address</div>
                      <input
                        type="text"
                        value={newLpAddress}
                        onChange={e => setNewLpAddress(e.target.value)}
                        style={{ width: '100%', background: '#070913', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', padding: '8px', borderRadius: '8px', outline: 'none', marginBottom: '10px' }}
                      />
                      <div style={{ color: '#94a3b8', marginBottom: '4px' }}>Allocation Points (Multiplier)</div>
                      <input
                        type="number"
                        value={newAllocPoints}
                        onChange={e => setNewAllocPoints(e.target.value)}
                        style={{ width: '100%', background: '#070913', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', padding: '8px', borderRadius: '8px', outline: 'none' }}
                      />
                    </div>

                    {deployingStatus && (
                      <div style={{ color: '#a855f7', fontWeight: 700, fontSize: '0.85rem', marginBottom: '14px', textAlign: 'center' }}>
                        {deployingStatus}
                      </div>
                    )}

                    <button onClick={handleAddPool} className="btn-gradient" style={{ width: '100%', justifyContent: 'center', padding: '12px' }}>
                      ➕ Add Pool to MasterChef
                    </button>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* WALLET MODAL */}
          {showWalletModal && (
            <div className="modal-overlay" onClick={() => setShowWalletModal(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px' }}>
                  <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>Connect Web3 Wallet</h3>
                  <button onClick={() => setShowWalletModal(false)} style={{ background: 'none', border: 'none', color: '#94a3b8', fontSize: '1.4rem', cursor: 'pointer' }}>✕</button>
                </div>
                
                {wallet ? (
                  <div>
                    <div style={{ background: 'rgba(255,255,255,0.05)', padding: '16px', borderRadius: '14px', marginBottom: '16px', border: '1px solid rgba(168,85,247,0.3)' }}>
                      <div style={{ fontSize: '0.75rem', color: '#94a3b8', textTransform: 'uppercase' }}>Active Account</div>
                      <div style={{ fontWeight: 700, fontSize: '0.9rem', wordBreak: 'break-all', marginTop: '6px', color: '#fff' }}>{wallet}</div>
                      <div style={{ fontSize: '0.85rem', color: '#22c55e', marginTop: '8px' }}>Balance: {balance} SOMI</div>
                    </div>
                    <button onClick={() => { setWallet(''); setShowWalletModal(false); }} className="btn-gradient" style={{ width: '100%', background: '#ef4444' }}>Disconnect Wallet</button>
                  </div>
                ) : (
                  <div>
                    <div className="wallet-option" onClick={handleConnectWallet}>
                      <span style={{ fontWeight: 700 }}>🦊 MetaMask / EIP-1193</span>
                      <span style={{ color: '#22c55e', fontSize: '0.75rem' }}>Ready</span>
                    </div>
                    <div className="wallet-option" onClick={handleConnectWallet}>
                      <span style={{ fontWeight: 700 }}>⚡ Thirdweb SDK v5</span>
                      <span style={{ color: '#38bdf8', fontSize: '0.75rem' }}>Client</span>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          <footer style={{ textAlign: 'center', color: '#64748b', marginTop: '40px', fontSize: '0.8rem' }}>
            SchwepeSwap MasterChef Hub &copy; 2026 | Somnia Address Target: <a href="https://explorer.somnia.network/address/0xdd10620866c4f586b1213d3818811faf3718fce3" target="_blank" style={{ color: '#38bdf8' }}>0xdd10620866c4f586b1213d3818811faf3718fce3</a>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
