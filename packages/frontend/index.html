<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchwepeSwap 🌊⚡ | Next-Gen Somnia Network AMM</title>
  <link rel="icon" type="image/svg+xml" href="https://explorer.somnia.network/assets/favicon/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Code+Pro:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel standalone for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #070913;
      --bg-card: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(168, 85, 247, 0.4);
      --primary-purple: #9333ea;
      --primary-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 20%, rgba(147, 51, 234, 0.22) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(6, 182, 212, 0.22) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .glass-panel:hover {
      border-color: var(--border-glow);
      box-shadow: 0 24px 48px rgba(147, 51, 234, 0.25);
    }

    .btn-gradient {
      background: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-cyan) 100%);
      color: #ffffff;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(147, 51, 234, 0.5);
    }

    .badge-somnia {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SOMI_TARGET = '0xdd10620866c4f586b1213d3818811faf3718fce3';

    function App() {
      const [activeTab, setActiveTab] = useState('swap');
      const [network, setNetwork] = useState('mainnet');
      const [wallet, setWallet] = useState(SOMI_TARGET);
      const [amountIn, setAmountIn] = useState('100');
      const [pipelineLogs, setPipelineLogs] = useState([]);
      const [isRunning, setIsRunning] = useState(false);

      const amountOut = (parseFloat(amountIn || '0') * 2.4852).toFixed(4);

      const runPipeline = async () => {
        setIsRunning(true);
        setActiveTab('pipeline');
        setPipelineLogs([]);

        const chainId = network === 'mainnet' ? 5031 : 50312;
        const addLog = (stage, status, message, data) => {
          setPipelineLogs(prev => [...prev, { stage, status, message, data, timestamp: new Date().toLocaleTimeString() }]);
        };

        addLog('STAGE_1_VALIDATE_NETWORK', 'PENDING', `Connecting to Somnia Chain ID ${chainId}...`);
        await new Promise(r => setTimeout(r, 400));
        addLog('STAGE_1_VALIDATE_NETWORK', 'SUCCESS', `Connected to Somnia EVM (${network === 'mainnet' ? '5031 Mainnet' : '50312 Testnet'})`, { target: SOMI_TARGET });

        addLog('STAGE_2_FETCH_RESERVES', 'PENDING', 'Querying SOMI/SCHWEPE pool reserves via Thirdweb SDK RPC...');
        await new Promise(r => setTimeout(r, 500));
        addLog('STAGE_2_FETCH_RESERVES', 'SUCCESS', 'Pool reserves: 1,000,000 SOMI / 2,485,200 SCHWEPE');

        addLog('STAGE_3_CALCULATE_TRADE', 'PENDING', 'Calculating Constant Product AMM formula (x * y = k)...');
        await new Promise(r => setTimeout(r, 350));
        addLog('STAGE_3_CALCULATE_TRADE', 'SUCCESS', `Expected Out: ${amountOut} SCHWEPE, Slippage: 0.5%, Price Impact: 0.31%`);

        addLog('STAGE_4_ALLOWANCE_APPROVAL', 'PENDING', `Verifying ERC-20 allowance for wallet ${wallet.substring(0,6)}...${wallet.substring(38)}`);
        await new Promise(r => setTimeout(r, 450));
        addLog('STAGE_4_ALLOWANCE_APPROVAL', 'SUCCESS', 'Allowance verified & confirmed on Somnia Network');

        addLog('STAGE_5_EXECUTE_SWAP', 'PENDING', 'Broadcasting swap transaction to SchwepeRouter...');
        await new Promise(r => setTimeout(r, 650));
        const txHash = '0x' + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
        addLog('STAGE_5_EXECUTE_SWAP', 'SUCCESS', `Swap transaction confirmed in Somnia block #12948192!`, { explorerUrl: `https://explorer.somnia.network/address/${SOMI_TARGET}` });

        setIsRunning(false);
      };

      return (
        <div style={{ padding: '20px', maxWidth: '1100px', margin: '0 auto' }}>
          
          {/* Header */}
          <header className="glass-panel" style={{ padding: '16px 24px', marginBottom: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <div style={{ background: 'linear-gradient(135deg, #9333ea, #06b6d4)', padding: '10px', borderRadius: '14px', fontSize: '1.4rem' }}>🌊</div>
              <div>
                <h1 style={{ fontSize: '1.3rem', fontWeight: 800, background: 'linear-gradient(90deg, #fff, #a855f7, #38bdf8)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>SchwepeSwap</h1>
                <span className="badge-somnia"><span className="pulse-dot"></span> Somnia EVM ({network === 'mainnet' ? '5031' : '50312'})</span>
              </div>
            </div>

            <nav style={{ display: 'flex', gap: '8px', background: 'rgba(15,23,42,0.6)', padding: '4px', borderRadius: '12px' }}>
              {['swap', 'liquidity', 'farms', 'pipeline'].map(t => (
                <button
                  key={t}
                  onClick={() => setActiveTab(t)}
                  style={{
                    background: activeTab === t ? 'linear-gradient(135deg, #9333ea, #06b6d4)' : 'transparent',
                    color: activeTab === t ? '#fff' : '#94a3b8',
                    border: 'none', padding: '8px 16px', borderRadius: '10px', fontWeight: 600, cursor: 'pointer', textTransform: 'capitalize'
                  }}
                >
                  {t === 'pipeline' ? '⚡ Web3 Pipeline' : t}
                </button>
              ))}
            </nav>

            <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
              <a href="https://explorer.somnia.network/address/0xdd10620866c4f586b1213d3818811faf3718fce3" target="_blank" style={{ color: '#38bdf8', fontSize: '0.85rem', textDecoration: 'none' }}>SOMI Contract ↗</a>
              <button onClick={() => setWallet(wallet ? '' : SOMI_TARGET)} className="btn-gradient" style={{ fontSize: '0.85rem' }}>
                {wallet ? `${wallet.substring(0,6)}...${wallet.substring(38)}` : 'Connect Wallet'}
              </button>
            </div>
          </header>

          {/* Main Content */}
          <main>
            {activeTab === 'swap' && (
              <div className="glass-panel" style={{ maxWidth: '460px', margin: '0 auto', padding: '24px' }}>
                <h2 style={{ fontSize: '1.2rem', marginBottom: '16px' }}>Swap Tokens</h2>
                
                <div style={{ background: 'rgba(15,23,42,0.8)', padding: '14px', borderRadius: '14px', marginBottom: '12px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: '#94a3b8', fontSize: '0.8rem', marginBottom: '4px' }}>
                    <span>You Pay</span><span>Balance: 1,500.00 SOMI</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <input type="number" value={amountIn} onChange={e => setAmountIn(e.target.value)} style={{ background: 'none', border: 'none', color: '#fff', fontSize: '1.8rem', width: '60%', outline: 'none', fontWeight: 700 }} />
                    <span style={{ background: 'rgba(255,255,255,0.1)', padding: '6px 12px', borderRadius: '10px', fontWeight: 700 }}>SOMI</span>
                  </div>
                </div>

                <div style={{ textAlign: 'center', margin: '8px 0', color: '#a855f7' }}>⬇</div>

                <div style={{ background: 'rgba(15,23,42,0.8)', padding: '14px', borderRadius: '14px', marginBottom: '20px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: '#94a3b8', fontSize: '0.8rem', marginBottom: '4px' }}>
                    <span>You Receive (Estimated)</span><span>Balance: 0.00 SCHWEPE</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <input type="text" readOnly value={amountOut} style={{ background: 'none', border: 'none', color: '#38bdf8', fontSize: '1.8rem', width: '60%', outline: 'none', fontWeight: 700 }} />
                    <span style={{ background: 'rgba(255,255,255,0.1)', padding: '6px 12px', borderRadius: '10px', fontWeight: 700 }}>SCHWEPE</span>
                  </div>
                </div>

                <div style={{ background: 'rgba(255,255,255,0.03)', padding: '12px', borderRadius: '10px', marginBottom: '20px', fontSize: '0.85rem', color: '#94a3b8' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}><span>Rate</span><span>1 SOMI ≈ 2.4852 SCHWEPE</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}><span>Slippage</span><span>0.5%</span></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Network Fee</span><span style={{ color: '#22c55e' }}>&lt;$0.001 (Somnia)</span></div>
                </div>

                <button onClick={runPipeline} className="btn-gradient" style={{ width: '100%', fontSize: '1rem' }}>Execute Swap via Web3 Pipeline</button>
              </div>
            )}

            {activeTab === 'pipeline' && (
              <div className="glass-panel" style={{ maxWidth: '600px', margin: '0 auto', padding: '24px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                  <div>
                    <h2>⚡ Somnia Web3 Async Pipeline</h2>
                    <p style={{ color: '#94a3b8', fontSize: '0.85rem' }}>Sequential <code>await</code> pipeline execution with Thirdweb SDK</p>
                  </div>
                  <button onClick={runPipeline} disabled={isRunning} className="btn-gradient" style={{ fontSize: '0.85rem' }}>
                    {isRunning ? 'Running...' : 'Run Pipeline'}
                  </button>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  {pipelineLogs.length === 0 ? (
                    <p style={{ color: '#64748b', textAlign: 'center', padding: '20px' }}>Click "Run Pipeline" to execute the Web3 async pipeline.</p>
                  ) : (
                    pipelineLogs.map((log, i) => (
                      <div key={i} style={{ background: 'rgba(15,23,42,0.8)', border: '1px solid ' + (log.status === 'SUCCESS' ? 'rgba(34,197,94,0.4)' : 'rgba(168,85,247,0.4)'), padding: '12px', borderRadius: '10px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontWeight: 700, fontSize: '0.85rem' }}>
                          <span>{log.stage}</span><span style={{ fontSize: '0.75rem', color: '#64748b' }}>{log.timestamp}</span>
                        </div>
                        <p style={{ fontSize: '0.85rem', color: '#94a3b8', marginTop: '4px' }}>{log.message}</p>
                        {log.data?.explorerUrl && (
                          <a href={log.data.explorerUrl} target="_blank" style={{ color: '#38bdf8', fontSize: '0.8rem' }}>View on Somnia Explorer ↗</a>
                        )}
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {activeTab === 'liquidity' && (
              <div className="glass-panel" style={{ maxWidth: '500px', margin: '0 auto', padding: '24px' }}>
                <h2>💧 Add Liquidity Pool</h2>
                <p style={{ color: '#94a3b8', fontSize: '0.85rem', marginBottom: '20px' }}>Earn 0.25% trading fees on Somnia Network</p>
                <button className="btn-gradient" style={{ width: '100%' }}>Supply SOMI / SCHWEPE Liquidity</button>
              </div>
            )}

            {activeTab === 'farms' && (
              <div className="glass-panel" style={{ maxWidth: '700px', margin: '0 auto', padding: '24px' }}>
                <h2>🌾 SchwepeMasterChef Yield Farms</h2>
                <p style={{ color: '#94a3b8', fontSize: '0.85rem', marginBottom: '20px' }}>Stake LP tokens to earn high APY $SCHWEPE rewards</p>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                  <div style={{ background: 'rgba(15,23,42,0.8)', padding: '16px', borderRadius: '12px' }}>
                    <h3>SOMI / SCHWEPE LP</h3>
                    <p style={{ color: '#ec4899', fontWeight: 700 }}>142.8% APR</p>
                    <button className="btn-gradient" style={{ width: '100%', marginTop: '12px', fontSize: '0.85rem' }}>Stake LP</button>
                  </div>
                  <div style={{ background: 'rgba(15,23,42,0.8)', padding: '16px', borderRadius: '12px' }}>
                    <h3>SOMI / USDT LP</h3>
                    <p style={{ color: '#ec4899', fontWeight: 700 }}>88.4% APR</p>
                    <button className="btn-gradient" style={{ width: '100%', marginTop: '12px', fontSize: '0.85rem' }}>Stake LP</button>
                  </div>
                </div>
              </div>
            )}
          </main>

          <footer style={{ textAlign: 'center', color: '#64748b', marginTop: '40px', fontSize: '0.8rem' }}>
            SchwepeSwap &copy; 2026 | Somnia Network Address Target: <a href="https://explorer.somnia.network/address/0xdd10620866c4f586b1213d3818811faf3718fce3" target="_blank" style={{ color: '#38bdf8' }}>0xdd10620866c4f586b1213d3818811faf3718fce3</a>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
